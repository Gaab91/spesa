name: Crea APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Controlla la configurazione Firebase
        run: |
          if grep -q "INCOLLA" src/firebase-config.js; then
            echo "::error file=src/firebase-config.js::Devi incollare i valori del tuo progetto Firebase in src/firebase-config.js (vedi GUIDA.md, passo 4)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installa le dipendenze
        run: npm install --no-audit --no-fund

      - name: Compila l'app web
        run: npm run build

      - name: Crea il progetto Android e applica le icone
        run: |
          npx cap add android
          cp -r icons/res/. android/app/src/main/res/
          npx cap sync android

      - name: Chiave di firma fissa (per poter aggiornare l'app senza disinstallarla)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Compila l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepara il file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LaSpesa.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LaSpesa-apk
          path: LaSpesa.apk

      - name: Pubblica nelle Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: La Spesa - build ${{ github.run_number }}
          files: LaSpesa.apk
